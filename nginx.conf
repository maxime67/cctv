server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://pv.viewsurf.com https://www.skaping.com; connect-src 'self' https://api.open-meteo.com https://www.windguru.cz" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressif pour les assets hachés par Vite
    # Les add_header de ce bloc remplacent ceux du bloc server — on les répète.
    location /assets/ {
        expires 1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://pv.viewsurf.com https://www.skaping.com; connect-src 'self' https://api.open-meteo.com https://www.windguru.cz" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
